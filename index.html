<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Piece a Day</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Banner -->
  <div class="banner"></div>

  <!-- Logo -->
  <div class="logo-container">
    <img src="logo.png" alt="Logo" class="logo">
  </div>

  <div class="container">
    <h1>Welcome to One Piece a Day!</h1>
    <p>Pick up one piece of trash a day and track your impact.</p>

    <!-- Leaderboard -->
    <h2>Leaderboard</h2>

    <table class="leaderboard">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Name</th>
          <th>Pieces collected</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>#1</td>
          <td>John Adam</td>
          <td>1,398</td>
        </tr>
        <tr>
          <td>#2</td>
          <td>Nancy Austin</td>
          <td>1,210</td>
        </tr>
        <tr>
          <td>#3</td>
          <td>Troy Baker</td>
          <td>980</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
